[package]
name = "acl-rust"
version = "0.0.1"
edition = "2018"
rust-version = "1.70"
description = "A Rust port of AtCoder Library (ACL). Unofficial."
license = "CC0-1.0"
repository = "https://github.com/hina-kura49/acl-rust"
keywords = ["competitive"]
categories = ["algorithms", "data-structures"]

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "./doc/katex-header.html"]

[lib]
name = "ac_library"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

[dev-dependencies]
proconio = "=0.3.6"
proconio-derive = "0.2.1"
rand = "0.7.3"
